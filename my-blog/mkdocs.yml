site_name: 字节与智能
site_url: https://yangzhongyu.site/
site_description: 聚焦 Agent 开发、工程实践与 AI 原生应用的技术分享。
site_author: Yang Zhongyu
copyright: Copyright &copy; 2026 Yang Zhongyu

repo_url: https://github.com/yzyspy/my_site
repo_name: yzyspy/my_site
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  custom_dir: overrides
  font: false
  palette:
    - scheme: slate
      primary: black
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
    - scheme: default
      primary: white
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    logo: material/console-line
    repo: fontawesome/brands/github

nav:
  - 首页: index.md
  - 技术专栏:
      - 智能体开发:
          - 分类首页: agent-development/index.md
          - UV + LangGraph CLI 入门: agent-development/uv-langgraph-cli.md
          - 网页端调用 LangGraph 服务: agent-development/langraph_sdk.md
          - RAG 知识库问答实践: agent-development/rag.md
      - TypeScript深入浅出:
          - 分类首页: typescript/index.md
          - async 的使用: typescript/async-await.md
  - 关于: about.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search:
      lang:
        - zh
        - en

extra_css:
  - assets/stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yzyspy
      name: GitHub

